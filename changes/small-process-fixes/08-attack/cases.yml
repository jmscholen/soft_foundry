commit_sha: 821f1e8ffc2ad8de1fe70af87eabe048e1ea222f
authorization_envelope:
  target: soft-foundry CLI and gate code at commit 821f1e8 (change small-process-fixes), in a scratch git clone under /tmp
  environment: local
  authorized_by: the change's phase-run contract (attack phase of small-process-fixes, adversarial_high); the repository owner's own tool, no third-party system
  allowed_surfaces:
    - "soft-foundry change new / change summary / gate verify|attack in the scratch clone"
    - "PhaseRunner#mark_blocked! and Gate#protection_findings called directly from scripts"
    - "read-only soft-foundry check and change summary on the real worktree"
  prohibited_surfaces:
    - any file outside changes/small-process-fixes/08-attack/ in the real worktree
    - network, provider APIs, production, other repositories
  data_constraints: synthetic handoffs and slugs only; no real credentials or customer data; /etc/hosts and /etc/passwd were only named as symlink targets, and /etc/hosts was not displayed
  network_constraints: none used
  destructive_actions: prohibited
cases:
  - id: ATTACK-001
    threat: THREAT-001
    violation_attempted: read or create a record outside changes/ through a crafted slug
    starting_privilege: user running the CLI
    steps:
      - "change new ../../etc --type fix; change new /tmp/x; change new a/./b"
      - "change summary ../../etc; /etc; a/../ok5"
    expected_safe_behavior: traversal and absolute slugs refused; summary names known changes
    observed: "../../etc and /tmp/x refused (invalid change slug); summary of ../../etc, /etc, a/../ok5 refused with the known-change list. a/./b was accepted and created changes/a/./b (the slug rule, unchanged by this change, allows . and / segments), staying inside changes/."
    result: denied
    evidence: [evidence/change-new-and-summary-paths.txt]
  - id: ATTACK-002
    threat: THREAT-002
    violation_attempted: rewrite or forge terminal lines via recorded text
    starting_privilege: author of a handoff.yml
    steps:
      - "handoff with ESC[2J, CR, LF, right-to-left override, zero-width space in status, blocking and findings severity"
      - "invalid UTF-8 in status; non-string and mapping blocking entries"
      - "run change summary and view output through cat -v"
    expected_safe_behavior: every control or format character shown as <U+XXXX>; one fact per line
    observed: "ESC, CR, LF, U+202E, U+200B all printed as <U+...>; the newline in a blocking item did not create a forged `owed: none` line. Invalid UTF-8 became replacement characters. Malformed handoffs showed status unreadable with a note line."
    result: denied
    evidence: [evidence/summary-hostile-handoffs.txt]
  - id: ATTACK-003
    threat: THREAT-003
    violation_attempted: make the runner's blocked write alter anything but status and notes of the phase it ran
    starting_privilege: author of a handoff.yml
    steps:
      - "call mark_blocked!(phase) on handoffs with comments, anchors, wrong-case status, string blocking, non-string notes"
      - "read the code: the phase is the runner's argument, never read from the handoff"
    expected_safe_behavior: only that phase's status and notes change; other fields kept
    observed: "status became blocked, blocking kept, notes appended; anchors survived. Only that phase's file was written. YAML comments in the handoff are dropped by the rewrite (cosmetic). Status Complete (wrong case), in_progress and string blocking were not marked."
    result: denied
    evidence: [evidence/mark-blocked-shapes.txt, evidence/mark-blocked-shapes.rb]
  - id: ATTACK-004
    threat: THREAT-004
    violation_attempted: lose or corrupt a blocked write when runner finishes race
    starting_privilege: three concurrent processes
    steps:
      - "eight complete-with-blocking handoffs; three forked processes each run mark_blocked! and finish! on all eight"
    expected_safe_behavior: every phase blocked once, blocking intact, one note, exit status recorded
    observed: "all eight phases blocked, blocking kept, exactly one Marked sentence each (idempotent). finish! recorded exit_status 0 in each."
    result: denied
    evidence: [evidence/mark-blocked-concurrency.txt, evidence/mark-blocked-concurrency.rb]
  - id: ATTACK-005
    threat: THREAT-005
    violation_attempted: make a blocker invisible to the summary or reach a passing gate with one
    starting_privilege: author of a handoff.yml
    steps:
      - "status blocked with blocking as a string and findings as a string; complete with blocking mapping; complete with blank-string blockers"
      - "gate attack on complete+blocking string, Complete (cased), blocked+empty blocking"
    expected_safe_behavior: gate fails each; summary still shows the blocker
    observed: "The gate failed all of them (no blocking conditions; handoff status; blocking recorded). The summary printed blocking: none and findings: none when blocking or findings is a string or mapping, so a blocked phase with a non-list blocking showed phase-status blocked but no blocker text. The runner also does not mark complete+string blocking blocked, though the gate does fail it."
    result: violated
    evidence: [evidence/summary-shape-hiding.txt, evidence/gate-on-blocking-shapes.txt]
  - id: ATTACK-006
    threat: THREAT-006
    violation_attempted: pass `protection stated` without protection being in force
    starting_privilege: author of tests.yml
    steps:
      - "call protection_findings with 16 tests.yml shapes (omitted, not_applicable with and without note, disabled with blank note, wrong case, non-string, non-list checks, in_force on a failed check)"
    expected_safe_behavior: omission, blank-note disabled and malformed values fail; claims are not verified (spec states structure only)
    observed: "omission, unnoted not_applicable, blank-note disabled, mixed-case or non-string values and non-list checks all failed. Passed: not_applicable with note `n/a`, disabled with note `x`, a list as protection_note, and protection: in_force on a check whose status is failed. These are within the stated structure-only limit."
    result: denied
    evidence: [evidence/protection-shapes.txt, evidence/protection-shapes.rb]
  - id: ATTACK-007
    threat: THREAT-007
    violation_attempted: make the parity check pass silently with a hostile access_control glob
    starting_privilege: author of .ai/repository.yml
    steps:
      - "lint empty, blank, unbalanced, absolute, parent, non-string, non-list, newline and zero-width globs"
    expected_safe_behavior: every unreadable glob is a failure, not a silent pass
    observed: "empty, blank, unbalanced, absolute, parent, nil/number, non-list and newline globs failed. A glob containing a zero-width space (U+200B) passed lint and can never match a real path, so protected paths named that way are silently not covered."
    result: violated
    evidence: [evidence/access-control-globs.txt, evidence/access-control-globs.rb]
  - id: ATTACK-008
    threat: THREAT-001
    violation_attempted: make change summary read a file outside the record by symlink
    starting_privilege: someone able to create files under changes/<slug>/
    steps:
      - "changes/evil/01-discovery/handoff.yml symlink to a YAML file outside the repository; summary evil"
    expected_safe_behavior: symlink refused, as the write paths refuse them
    observed: "summary followed the symlink and echoed status and blocking from the outside file. Requires write access to the record, and only status, blocking and findings fields are echoed."
    result: violated
    evidence: [evidence/summary-symlink.txt]
  - id: ATTACK-009
    threat: THREAT-009
    violation_attempted: leave raw invisible characters in the new guidance or make it ambiguous
    starting_privilege: reviewer of the diff
    steps:
      - "scan README.md and .ai for zero-width, bidi and BOM characters; run soft-foundry check"
      - "read the four guidance additions"
    expected_safe_behavior: no raw hidden characters; check passes; guidance says escape or build in a script
    observed: "0 raw hidden characters; check passed. All four texts give the escape form and the script option."
    result: denied
    evidence: [evidence/content-clean-guidance.txt]
  - id: ATTACK-010
    threat: THREAT-008
    violation_attempted: record a lower risk or a track that skips hardening
    starting_privilege: user running change new
    steps:
      - "--type Fix, --risk HIGH, --type ' fix' (case, whitespace)"
      - "--risk high --track iterative"
      - "--risk=low --type=docs (equals form); --type fix --type security (repeated flag)"
    expected_safe_behavior: variants refused; high risk forces gated
    observed: "case and whitespace variants refused with the allowed list; high with iterative refused. The equals form was silently ignored (type and risk stayed at the template placeholder; --risk=high --track=iterative produced gated with the risk placeholder), and a repeated --type kept the first value with the second left in the argument list unreported. No lower risk could be recorded; the failure is a silent drop, not an evasion."
    result: violated
    evidence: [evidence/change-new-and-summary-paths.txt]
  - id: ATTACK-011
    threat: THREAT-010
    violation_attempted: hang or flood the summary or runner with oversized or alias-expanding handoffs
    starting_privilege: author of a handoff.yml
    steps:
      - "300000-byte handoff; alias references; a nested alias bomb of nine levels of nine; run change summary and mark_blocked!"
      - "20 blocking entries in the summary list"
    expected_safe_behavior: summary refuses oversize and aliases; lists capped; runner returns promptly
    observed: "summary refused the oversize file (reads at most 262144) and aliases, quickly. mark_blocked! on the nine-level alias bomb returned in well under the 15-second limit. Blocking lists are capped at five by Display.list."
    result: denied
    evidence: [evidence/summary-hostile-handoffs.txt, evidence/mark-blocked-shapes.txt]
