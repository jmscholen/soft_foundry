  tree: 82a4bbdc844f58ade9f4a029c9a930d72eb8727f
  command: "bundle exec rake test (as bundle exec ruby <rake 13.4.2 gem exe> test; env -u ANTHROPIC_API_KEY -u OPENAI_API_KEY -u XAI_API_KEY -u GEMINI_API_KEY -u GOOGLE_API_KEY -u SOFT_FOUNDRY_BILLING -u SOFT_FOUNDRY_PHASE -u SOFT_FOUNDRY_PARALLEL -u SOFT_FOUNDRY_GUARD), run alone"
  outcome: passed
