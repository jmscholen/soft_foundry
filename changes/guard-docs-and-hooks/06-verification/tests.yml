# The full suite on this tree (git rev-parse HEAD^{tree} at 6af7142), provider
# keys and SOFT_FOUNDRY_* unset, run alone. A record of a run, not a test
# result: the transcript is evidence/full-suite.txt. The rake executable was
# invoked by its gem path because this machine's rbenv global is `system` and
# has no rake shim; the task and test files are the Rakefile's.
