  - id: EVAL-008
    criteria: [REQ-GDH-005]
    persona: Maintainer using every route of the CLI, and the branch's own checks
    starting_state: A scratch repository with a throwaway HOME, a stub claude on PATH, the library from this checkout; and this checkout itself
    steps:
