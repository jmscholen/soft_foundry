# Iterative track only. `soft-foundry change vet` records the person's
# acceptance of the explored feature and the commit the specification
# locked at; from then on the phases from implement onward apply as on the
# gated track. `change reopen` clears it, resets those phases to pending,
# and appends the reopening here so the history stays in the record.
vetted: null
# vetted:
#   at: 2026-09-16T00:00:00Z
#   by: name
#   commit: sha
reopenings: []
# - at: 2026-09-16T00:00:00Z
#   from_commit: sha the change had been vetted at
#   reason: why the person sent it back to exploring

# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
- phase: discover
  rationale: Repository already discovered for prior changes at an identical layout; this change adds no technology.
- phase: specify
  rationale: Intake captures the requirements with stable IDs REQ-RG-001..007 in 00-intake/request.md at sufficient granularity for a change this size (gated track, by the repository's established process for repository-native changes).
- phase: threat_model
  rationale: Reasoned through in 00-intake/assumptions.md. The gate reads tests.yml and asks git four read-only questions about two commits; it writes nothing. A false claim (a red_commit whose test did not actually fail) is not detectable without re-running history and is stated as the check's limit.
- phase: plan
  rationale: 05-implementation/log.md is the plan record for a change this size.
- phase: attack
  rationale: Reasoned through directly (red equals green, red from another branch, a missing test file, a RED with no code after it, malformed and unknown hashes, invalid YAML) and covered by tests and the evaluation transcript rather than adversarially tested; recorded as a real limitation.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment would not satisfy that. The maintainer's own merge decision is the real judgment point, and the advisory reports this skip on every gate run, as intended.
- phase: learn
  rationale: Lessons are recorded directly in 05-implementation/log.md rather than as separate formal learning artifacts, given the change's scope.
