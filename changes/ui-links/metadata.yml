# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
- phase: discover
  rationale: Repository already discovered for prior changes at an identical layout; this change touches only the three page files written in the changes it is stacked on.
- phase: specify
  rationale: Intake captures the requirements with stable IDs REQ-LINK-001..004 in 00-intake/request.md, including the accessibility requirement REQ-LINK-004 with its WCAG success criteria, at sufficient granularity for a change this size (gated track, by the repository's established process for repository-native changes).
- phase: threat_model
  rationale: No new surface. No route, no data, and no request changed; popups are built from data the page already renders, through the same text-only helpers, and the security review states this. The threat models of ui-server and ui-repositories cover the page.
- phase: plan
  rationale: The request was three sentences; the decisions a plan would hold are in 05-implementation/decisions.md.
- phase: attack
  rationale: No new surface to attack; see the threat_model rationale. The static test that forbids markup-parsing APIs covers the popup code. Recorded as a real limitation.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment would not satisfy that. The maintainer's own merge decision is the real judgment point, and the advisory reports this skip on every gate run, as intended.
