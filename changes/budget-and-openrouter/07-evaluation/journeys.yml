journeys:
  - id: EVAL-001
    criteria: [budget-ledger-scaffolding]
    persona: repository maintainer
    starting_state: fresh git repository
    steps: ["soft-foundry init --no-onboard", "soft-foundry change new demo", "soft-foundry budget status --change demo"]
    assertions: ["budget.yml scaffolded with an empty ledger", "status reports spend as unknown, not zero", "a cap is shown"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-002
    criteria: [budget-ledger-recording, openrouter-provider]
    persona: repository maintainer
    starting_state: change record from EVAL-001
    steps: ["budget record ... openrouter/meta-llama/llama-3.1-8b-instruct:free 2000in/500out $0.15", "budget record ... anthropic/claude-sonnet-5 900000in/100000out $40.00", "budget status --change demo"]
    assertions: ["tokens sum to 902000in/100500out", "estimated spend sums to $40.15", "exit 0 (under the $50.00 default cap)"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-003
    criteria: [version-guard]
    persona: maintainer on an older Ruby via a version manager
    starting_state: this working tree, Ruby 2.7.8 binary
    steps: ["soft-foundry version"]
    assertions: ["plain requires-Ruby-3.2 message", "exit 1", "no raw SyntaxError"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-004
    criteria: [install-completeness]
    persona: repository maintainer
    starting_state: repo from EVAL-001 after init
    steps: ["soft-foundry doctor"]
    assertions: [".ai/manifest.yml check line present and passing"]
    evidence: [evidence/journey-transcript.log]
    result: pass
