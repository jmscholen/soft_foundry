change:
  id: ui-explainer-timeline
  title: 'soft-foundry ui: the workflow explained, and each change''s timeline and spend'
git:
  worktree: /Users/jscholen-iou/dev/soft_foundry
  branch: change/ui-explainer-timeline
type: feature                  # feature | fix | refactor | docs | infrastructure | security | chore
risk: low                  # low | medium | high; a high risk change is always on the gated track (.ai/workflow.yml tracks.forced_by_risk)
track: gated            # gated | iterative (.ai/workflow.yml tracks:); set by `change new --track`
status: in_progress          # intake | exploring | in_progress | awaiting_human | judged | closed
current_phase: learn
created_at: 2026-10-02T04:17:12Z
surfaces:
  application: true
  database: false
  infrastructure: false
  security: false
  accessibility: true    # true when a person perceives or operates the result (UI, CLI output, documents); loads .ai/rules/accessibility.md and enables the go-live accessibility advisories. Set automatically by `change new` when the repository profile records a user-facing framework.
  observability: false
  policy: false           # true when the change alters what the application collects, shares, retains, protects, or promises in its privacy policy, security policy, or terms; loads .ai/rules/policy-conformance.md and enables the go-live policy advisories. Set automatically by `change new` when the repository profile records a published policy document.

# Human-boundary decisions this change required (.ai/policies/human-boundaries.yml),
# each recorded once a person made it. While a decision the review says is owed
# has no entry here, the change is parked with status: awaiting_human.
human_decisions: []
# - boundary: legal commitment
#   subject: privacy policy, clause 4 (third-party analytics recipient)
#   decided_by: TBD
#   decided_at: TBD
#   decision: approved | declined

# Iterative track only. `soft-foundry change vet` records the person's
# acceptance of the explored feature and the commit the specification
# locked at; from then on the phases from implement onward apply as on the
# gated track. `change reopen` clears it, resets those phases to pending,
# and appends the reopening here so the history stays in the record.
vetted: null
# vetted:
#   at: 2026-09-16T00:00:00Z
#   by: name
#   commit: sha
reopenings: []
# - at: 2026-09-16T00:00:00Z
#   from_commit: sha the change had been vetted at
#   reason: why the person sent it back to exploring

# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
- phase: discover
  rationale: Repository already discovered for prior changes at an identical layout; this change adds no technology and no file. What the real records hold (few recorded times, empty ledgers) was read before building and is recorded in 07-evaluation/results.md.
- phase: specify
  rationale: Intake captures the requirements with stable IDs REQ-UX-001..007 in 00-intake/request.md, including the accessibility requirement REQ-UX-006 with its WCAG success criteria, at sufficient granularity for a change this size (gated track, by the repository's established process for repository-native changes).
- phase: threat_model
  rationale: No new surface. The server's routes, headers, and refusals are unchanged and its tests pass unchanged; the threat model in changes/ui-server/03-threat-model/ covers the page, and the one relevant behaviour here (record text in the new views is text) is exercised with hostile strings in evaluation.
- phase: plan
  rationale: The maintainer approved the plan for all three UI changes before work began; this change's part is restated in 05-implementation/log.md.
- phase: attack
  rationale: No new surface to attack; see the threat_model rationale. Markup in a name and in a time was rendered as text or kept off the timeline in EVAL-005. Recorded as a real limitation, since nothing here was adversarially tested beyond that.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment would not satisfy that. The maintainer's own merge decision is the real judgment point, and the advisory reports this skip on every gate run, as intended.
