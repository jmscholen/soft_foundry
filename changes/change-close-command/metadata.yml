# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
- phase: discover
  rationale: Repository already discovered for prior changes at an identical layout;
    no new technology introduced by this change itself.
- phase: specify
  rationale: Intake captures the requirement (a deterministic ci check plus a
    human-gated close command) at sufficient granularity for a change this size.
    See 00-intake/assumptions.md.
- phase: threat_model
  rationale: The only new external interaction is shelling out to an already-
    installed `gh` CLI with argv-only arguments (a PR number from --pr, and
    comment bodies this session composes) - no user/repository-controlled string
    reaches a shell. No new write surface either - `change close` and
    `request-discharge` only ever write this change's own metadata.yml/evidence.yml
    or post a PR comment, never application code.
- phase: plan
  rationale: 05-implementation/log.md is the plan record for a change this size.
- phase: attack
  rationale: No new attack surface beyond the threat_model rationale above;
    reasoned through rather than adversarially tested, given this change's scope.
- phase: review
  rationale: No independent fresh-context reviewer was run, given this change's
    scope; the pull request itself is the review point before merge.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design;
    self-judgment would not satisfy that. The maintainer's own merge decision is
    the real judgment point.
- phase: learn
  rationale: Lessons are recorded directly in 05-implementation/log.md rather
    than as separate formal learning artifacts, given the change's scope.
