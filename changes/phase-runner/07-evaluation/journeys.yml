    starting_state: "scratch repo with this repo's real .ai/; branch change/c1; intake through attack complete at HEAD, current_phase evaluate"
    steps: ["soft-foundry phase run review --dry-run", "soft-foundry hooks install --claude; phase run review --dry-run | head -2", "phase run review --dry-run --shell codex -- --full-auto | head -1"]
    assertions: ["dry run prints ! warn guard: ... not installed here ..., then would run review of c1 with: claude -p <prompt>, then the prompt naming the change, phase, skill, the five contract files, and the five instructions; exit 0", "with the hook installed the warning is gone", "the codex form is codex exec --full-auto <prompt>"]
