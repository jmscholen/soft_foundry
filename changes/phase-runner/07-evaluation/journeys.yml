    assertions: ["06-verification is already complete ...; exit 1", "15-learning cannot start: its predecessor 14-judgment is pending; exit 1", "unknown phase 'polish'; lifecycle phases: ...; exit 1", "change it1 is exploring; the exploring stage is worked with the person, not by a runner (run change vet first)"]
