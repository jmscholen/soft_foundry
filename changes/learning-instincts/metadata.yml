# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
- phase: discover
  rationale: Repository already discovered for prior changes at an identical layout; this change adds no technology.
- phase: specify
  rationale: Intake captures the requirements with stable IDs REQ-LRN-001..008 in 00-intake/request.md at sufficient granularity for a change this size (gated track, by the repository's established process for repository-native changes).
- phase: threat_model
  rationale: Reasoned through in 00-intake/assumptions.md. The one new write outside a change record is .ai/rules/learned.md, and it happens only through a change record on a change branch; the content written is instinct text an agent authored in a record, which is the same trust level as every rule proposal the learning skill already made.
- phase: plan
  rationale: 05-implementation/log.md is the plan record for a change this size.
- phase: attack
  rationale: Reasoned through directly (an instinct with a hostile action promoted into rules; promotion from main; a closed record; malformed instincts; duplicate ids) and covered by tests and the evaluation transcript rather than adversarially tested; recorded as a real limitation.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment would not satisfy that. The maintainer's own merge decision is the real judgment point, and the advisory reports this skip on every gate run, as intended.
