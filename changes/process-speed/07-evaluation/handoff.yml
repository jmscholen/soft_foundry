findings:
- id: EVA-001
  severity: minor
  summary: The follow-up advisory is printed for any finding marked outside_change,
    even when the outside-change check rejects it. It says "concerns code outside
    this change" for a path the change modified, and "carried to (no follow_up named)"
    when follow_up is missing (evidence/eval-010).
- id: EVA-002
  severity: minor
  summary: The round-cap message says "has sealed N remediation rounds", but N also
    counts reopen entries that reset a complete, unsealed remediation. It was refused
    as "sealed 2" with no Record remediate commit (eval-004a), and past the limit
    it reads "has sealed 3 ..., the limit ... 2" (eval-006). Wording only; the conservative
    count is intended (THREAT-002).
- id: EVA-003
  severity: minor
  summary: A reopen on an already parked change gives a generic awaiting_human refusal
    without the boundary, rounds or the three decisions. The change status advisory
    still carries them.
- id: EVA-004
  severity: minor
  summary: A new-rules specification with zero must criteria still fails "must criteria
    approved" until an entry with criteria [] is recorded (eval-001). Confirm that
    this is intended and documented.
- id: EVA-005
  severity: minor
  summary: The blocked-basis check accepts any must id in blocked_by and does not
    confirm that it is unmet (structure-only gate). Judgment should check blocked_by
    against the evidence.
- id: EVA-006
  severity: minor
  summary: The outside-change check also requires paths on the finding, which REQ-009
    and AC-011 do not mention. Documentation and review should confirm the user documentation
    states it; this phase may not read DOCS.
- id: EVA-007
  severity: minor
  summary: 'Accessibility: the cap refusal is a single line of about 520 characters.
    It survives NO_COLOR and ASCII stripping, but would read better split into an
    outcome line and one line per decision.'
