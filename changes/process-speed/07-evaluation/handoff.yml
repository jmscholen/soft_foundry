notes: 'Size full_route_sweep (no scope declared). There is no graphical UI, so the
  sweep covered every touched command through the real CLI of this worktree (Ruby
  3.3.1, NO_COLOR=1, SOFT_FOUNDRY_PHASE and SOFT_FOUNDRY_PARALLEL unset for the maintainer
  persona) against throwaway git repositories under /tmp. Each carried a copy of the
  branch .ai/. Phases a journey did not exercise were filled with the shipped HarnessEval.complete_phase!;
  seals, reopens, phase run and release were real commands. phase run used a stand-in
  claude on PATH, so no real session could start. The legacy comparison ran main''s
  lib/ and exe/ (git archive) against a record built with main''s control plane. Guard
  limitations: the Write tool refuses paths outside the repository, so the scratch
  fixtures and helper scripts under /tmp were created through Bash, which the guard
  checks against deny sets only. Nothing in the repository outside 07-evaluation/
  was written. A shell command naming a docs path was refused and not retried. DOCS
  was not read, so the documentation half of AC-017 stays with documentation and review
