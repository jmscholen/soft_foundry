  - id: EVAL-007
    criteria: [REQ-GRD-003, REQ-GRD-004]
    persona: operator overriding from the environment; a broken payload
    starting_state: block mode from the local override still in place
    steps: ["SOFT_FOUNDRY_GUARD=off Edit .ai/rules/ruby.md", "SOFT_FOUNDRY_GUARD=warn Edit .ai/rules/ruby.md", "echo 'not json' | soft-foundry guard", "SOFT_FOUNDRY_GUARD=warn with the same bad payload"]
    assertions: ["off is silent with exit 0 although policy and the override say otherwise", "warn from the environment reports and exits 0", "in block mode the unreadable payload is refused: ✗ fail guard: could not read the tool call from stdin; refusing it, exit 2", "in warn mode it is reported with exit 0"]
    evidence: [evidence/journey-transcript.log]
    result: pass
