journeys:
  - id: EVAL-001
    criteria: [REQ-GRD-005, REQ-GRD-006]
    persona: repository owner with an existing .claude/settings.json holding their own Bash hook and permissions
    starting_state: "scratch repo with this repo's real .ai/; .claude/settings.json with permissions.allow and one foreign PreToolUse hook"
    steps: ["soft-foundry doctor | grep guard", "soft-foundry hooks install --claude (twice)", "cat .claude/settings.json", "soft-foundry doctor | grep guard", "soft-foundry hooks uninstall --claude (twice)", "cat .claude/settings.json", "soft-foundry hooks install --claude --local"]
    assertions: ["doctor prints fail claude guard hook (mode: warn, repository policy ...); install with soft-foundry hooks install --claude", "install prints the file, the matcher, and the mode; a second install adds nothing", "settings.json keeps permissions.allow and the foreign hook and holds exactly one Soft Foundry entry whose command contains soft-foundry guard", "doctor prints pass claude guard hook (mode: warn, ...)", "uninstall removes only the Soft Foundry entry; the file is otherwise as it was; a second uninstall says no guard hook installed", "--local writes settings.local.json beside settings.json"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-002
    criteria: [REQ-GRD-002]
    persona: maintainer on main with no change record
    starting_state: same repo on main
    steps: ["feed Edit .ai/rules/ruby.md to soft-foundry guard"]
    assertions: ["silent, exit 0: nothing is guarded outside a change"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-003
    criteria: [REQ-GRD-001, REQ-GRD-003]
    persona: implementing agent in warn mode (repository policy)
    starting_state: branch change/c1 with a record at current_phase implement, committed
    steps: ["Edit lib/app.rb", "Edit .ai/rules/ruby.md", "Write docs/README.md", "Read .ai/harness-evals/README.md", "cat .soft-foundry/guard.log"]
    assertions: ["the allowed edit is silent with exit 0", "each violation prints one ! warn guard: line naming the tool, the path, the skill's set, and the mode, and exits 0", "the log holds one line per violation with timestamp, mode, tool, skill, path, and reason"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-004
    criteria: [REQ-GRD-001, REQ-GRD-003]
    persona: same agent after the machine-local override sets block
    starting_state: .soft-foundry/enforcement.yml with guard.mode block
    steps: ["soft-foundry doctor | grep guard", "Edit lib/app.rb", "Edit .ai/rules/ruby.md", "MultiEdit changes/c1/06-verification/results.md", "Write /etc/hosts"]
    assertions: ["doctor shows mode: block, machine-local override (.soft-foundry/enforcement.yml)", "the allowed edit is still silent with exit 0", "each violation prints one ✗ fail guard: line and exits 2; the path outside the repository is refused with 'outside the repository; no skill may write there'"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-005
    criteria: [REQ-GRD-001]
    persona: same agent running shell commands in block mode
    starting_state: as EVAL-004
    steps: ["Bash bundle exec rake test", "Bash git commit -am wip", "Bash rm -rf .ai/policies", "Bash echo x >> changes/c1/13-review/functional.md", "Bash cp lib/app.rb docs/copy.rb"]
    assertions: ["commands naming no denied path pass silently", "commands naming a denied path are refused with exit 2 and the message says Bash is checked against deny sets only"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-006
    criteria: [REQ-GRD-002]
    persona: verifying agent
