- phase: threat_model
  rationale: Reasoned through in 00-intake/assumptions.md rather than as a separate
    phase. The guard reads a JSON payload from a coding shell and answers with an
    exit code; its only writes are an append-only machine-local log and, on install,
    a JSON settings file rewritten through SafeWrite. Fail-closed behaviour in block
    mode and the Bash heuristic's limits are stated in the policy file and the README.
- phase: plan
  rationale: 05-implementation/log.md is the plan record for a change this size.
- phase: attack
  rationale: Reasoned through directly (bypass by symlinked settings file, malformed
    payload, paths outside the root, quoted paths in Bash) and covered by tests and
    the evaluation transcript rather than adversarially tested; recorded as a real
    limitation, not equivalent to attack coverage. The Bash heuristic is documented
    as deny-only for exactly this reason.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment
    would not satisfy that. The maintainer's own merge decision is the real judgment
    point, and the advisory reports this skip on every gate run, as intended.
- phase: learn
  rationale: Lessons are recorded directly in 05-implementation/log.md rather than
