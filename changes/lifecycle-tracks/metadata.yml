  rationale: Reasoned through directly (the vet/reopen/lock/track-permitted paths
    and the check invariant are each exercised by tests and the evaluation transcript)
    rather than adversarially tested; recorded as a real limitation, not equivalent
    to attack coverage.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment
