type: feature
risk: low
track: gated               # added by hand: this record was scaffolded before `track:` existed in the template; the default track is gated
status: in_progress
current_phase: review
created_at: 2026-09-16T19:37:50Z
surfaces:
  application: true
  database: false
  infrastructure: false
  security: false
  accessibility: true     # CLI output and documents a person reads; true when a person perceives or operates the result (UI, CLI output, documents); loads .ai/rules/accessibility.md and enables the go-live accessibility advisories. Set automatically by `change new` when the repository profile records a user-facing framework.
  observability: false
  policy: false           # true when the change alters what the application collects, shares, retains, protects, or promises in its privacy policy, security policy, or terms; loads .ai/rules/policy-conformance.md and enables the go-live policy advisories. Set automatically by `change new` when the repository profile records a published policy document.

# Human-boundary decisions this change required (.ai/policies/human-boundaries.yml),
# each recorded once a person made it. While a decision the review says is owed
# has no entry here, the change is parked with status: awaiting_human.
human_decisions: []
# - boundary: legal commitment
#   subject: privacy policy, clause 4 (third-party analytics recipient)
#   decided_by: TBD
#   decided_at: TBD
#   decision: approved | declined

# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
- phase: discover
  rationale: Repository already discovered for prior changes at an identical layout; this change adds no technology. The one discovery-shaped fact it needs (this repository's development environment) is recorded directly in .ai/repository.yml under environments.
- phase: specify
  rationale: Intake captures the requirements with stable IDs REQ-TRK-001..012 in 00-intake/request.md at sufficient granularity for a change this size. This is the last change in this repository to use that substitution by default; the change itself exists so that a gated change keeps needing the specification and an iterative one drafts it while exploring.
- phase: threat_model
  rationale: No new external interaction, credential, or network access. New writes are confined to the change record (metadata.yml, phase handoffs on reopen) and are initiated by a person through the CLI; new reads are git config user.name and files the gate already reads.
- phase: plan
  rationale: 05-implementation/log.md is the plan record for a change this size.
- phase: attack
  rationale: Reasoned through directly (the vet/reopen/lock/track-permitted paths and the check invariant are each exercised by tests and the evaluation transcript) rather than adversarially tested; recorded as a real limitation, not equivalent to attack coverage.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment would not satisfy that. The maintainer's own merge decision is the real judgment point, and the advisory reports this skip on every gate run, as intended.
- phase: learn
  rationale: Lessons are recorded directly in 05-implementation/log.md rather than as separate formal learning artifacts, given the change's scope.
