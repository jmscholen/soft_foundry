    steps: ["soft-foundry change new it1 --title 'Try a thing' --track iterative", "soft-foundry change new nope --track casual", "grep track/status/current_phase in metadata.yml", "ls changes/it1/exploration", "commit", "soft-foundry change status | head -3", "soft-foundry ci | tail -1"]
