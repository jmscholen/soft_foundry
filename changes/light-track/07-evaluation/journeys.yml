  - id: EVAL-008
    criteria: [AC-008]
    persona: maintainer, including one reading with a screen reader or in a log
    starting_state: a light record with intake, specification and implementation sealed
    steps:
      - "soft-foundry change status c1 with NO_COLOR=1 and no terminal"
      - remove every non-ASCII character from the output
      - "soft-foundry change status c1 --json"
    assertions:
      - no escape sequence is emitted and the track line reads 'track: light'
      - each of the six stepped-over phases reads 'optional on the light track'; phases optional on every track read 'optional'; required pending phases carry no label
      - one phase per line, each beginning with its directory name
      - "--json carries track.name light and skip_reason track for a stepped-over phase"
    evidence: [evidence/EVAL-008.txt]
    result: pass
  - id: EVAL-009
    criteria: [AC-009]
    persona: maintainer
    starting_state: a new repository with the control plane installed
    steps:
      - "soft-foundry change new n1 --track nosuch"
      - "soft-foundry change new n1 with no --track; soft-foundry change new i1 --track iterative"
      - a gated record worked and sealed through all twelve phases, gated, merged and closed
      - a record with no rules line and no track line, status and gate intake
      - "soft-foundry ci in this worktree"
    assertions:
      - "the unknown track is refused, nothing is created, and the message lists gated, iterative and light"
      - the default is still gated and no phase of a gated record is labelled optional on a track; the iterative record starts exploring
      - the gated record passes gate all with twelve complete phases and closes
      - the older record shows status and passes gate intake
      - ci exits 0 (control plane check, every harness eval, every open record's gates)
    evidence: [evidence/EVAL-009.txt, evidence/worktree-ci.txt]
    result: pass
  - id: EVAL-010
    criteria: [AC-001, AC-009]
    persona: maintainer
    starting_state: one repository holding a closed, merged light record and an open light record with three phases sealed
    steps:
