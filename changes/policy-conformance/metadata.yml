type: feature                  # feature | fix | refactor | docs | infrastructure | security | chore
risk: low                  # low | medium | high
status: intake             # intake | in_progress | awaiting_human | judged | closed
current_phase: intake
created_at: 2026-09-15T11:47:15Z
surfaces:
  application: true
  database: false
  infrastructure: false
  security: false
  accessibility: true    # CLI output (advisory lines, check warning) and documents (a standard, templates, README); # true when a person perceives or operates the result (UI, CLI output, documents); loads .ai/rules/accessibility.md and enables the go-live accessibility advisories. Set automatically by `change new` when the repository profile records a user-facing framework.
  observability: false

# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
  - phase: discover
    rationale: Repository already discovered for prior changes at an identical layout; this change adds no technology. The one discovery-shaped fact it needs (what policy documents this repository publishes) is recorded directly in .ai/repository.yml under policies.
  - phase: specify
    rationale: Intake captures the requirements (a named policy-conformance standard, a policies block in the repository profile, a live surfaces.policy flag, advisories that report but never block, a human-boundary path for policy text changes, a level-5 maturity capability, a check warning) with stable IDs REQ-POL-001..008 in 00-intake/request.md at sufficient granularity for a change this size.
  - phase: threat_model
    rationale: No new external interaction, credential, or write outside the change record and metadata.yml. The advisory only reads files the gate already reads; the scan reads basenames in a fixed list of directories; change new edits one line of a file it just wrote.
  - phase: plan
    rationale: 05-implementation/log.md is the plan record for a change this size.
  - phase: attack
    rationale: Reasoned through directly rather than adversarially tested, given this change's scope; recorded as a real limitation, not equivalent to attack coverage.
  - phase: judge
    rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment would not satisfy that. The maintainer's own merge decision is the real judgment point, and the advisory reports this skip on every gate run, as intended.
  - phase: learn
    rationale: Lessons are recorded directly in 05-implementation/log.md rather than as separate formal learning artifacts, given the change's scope.
