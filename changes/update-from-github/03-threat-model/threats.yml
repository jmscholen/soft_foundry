threats:
  - id: THREAT-001
    requirements: [REQ-UPD-002]
    category: dependency
    attacker: whoever can alter what the releases API returns, or a man in the middle without TLS
    goal: have a different file installed
    vector: an asset named otherwise, a tag naming a different version, a tarball of other code
    impact: arbitrary code installed as the user
    likelihood: low
    mitigation: MIT-002
    attack_case_required: true
  - id: THREAT-002
    requirements: [REQ-UPD-002]
    category: file
    attacker: whoever controls the tarball
    goal: write outside the temporary directory
    vector: archive entries with .. or absolute paths
    impact: files overwritten as the user
    likelihood: low
    mitigation: MIT-003
    attack_case_required: false
  - id: THREAT-003
    requirements: [REQ-UPD-002]
    category: secrets
    attacker: a host a redirect points at
    goal: receive the user's GITHUB_TOKEN
    vector: a 302 to another host while a token is in the environment
    impact: token disclosure
    likelihood: low
    mitigation: MIT-004
    attack_case_required: true
  - id: THREAT-004
    requirements: [REQ-UPD-003]
    category: infrastructure
    attacker: anyone who can push a tag
    goal: publish a release whose version does not match the code, or that fails its tests
    vector: a mistyped or stale tag
    impact: a release that `update` installs under the wrong version
    likelihood: medium
    mitigation: MIT-005
    attack_case_required: false
