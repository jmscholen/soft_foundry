# Iterative track only. `soft-foundry change vet` records the person's
# acceptance of the explored feature and the commit the specification
# locked at; from then on the phases from implement onward apply as on the
# gated track. `change reopen` clears it, resets those phases to pending,
# and appends the reopening here so the history stays in the record.
vetted: null
# vetted:
#   at: 2026-09-16T00:00:00Z
#   by: name
#   commit: sha
reopenings: []
# - at: 2026-09-16T00:00:00Z
#   from_commit: sha the change had been vetted at
#   reason: why the person sent it back to exploring

# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases:
- phase: discover
  rationale: Repository already discovered for prior changes at an identical layout. What this change needed (how soft-foundry processes appear in ps, that phase run stamps executed_by at start and finish, that soft-foundry shell replaces its process) was read from the code and the live process table and is recorded in 00-intake/assumptions.md.
- phase: specify
  rationale: Intake captures the requirements with stable IDs REQ-PS-001..008 in 00-intake/request.md, including the accessibility requirement REQ-PS-008 with its WCAG success criteria, at sufficient granularity for a change this size (gated track, by the repository's established process for repository-native changes).
- phase: plan
  rationale: The request was two sentences and the design is small; the decisions that a plan would hold are in 05-implementation/decisions.md, and the reading of the request is stated in 00-intake/assumptions.md for the maintainer to confirm at merge.
- phase: judge
  rationale: An isolated, fresh-context judgment is the skill's explicit design; self-judgment would not satisfy that. The maintainer's own merge decision is the real judgment point, and the advisory reports this skip on every gate run, as intended.
