journeys:
  - id: EVAL-001
    criteria: [REQ-REPO-001, REQ-REPO-006]
    persona: a program holding the link
    starting_state: four scratch repositories (one the server's own, one with a claude session, one named with --repo, one whose directory name is markup with a grok session), a plain directory with a claude process, and the maintainer's own repositories
    steps: ["soft-foundry ui --port 4879 --repo <scratch>/gamma", "GET /api/repositories with the token"]
    assertions: ["the printed link ends in #token= and a code", "the four staged repositories are listed with home, open and closed counts, and open changes; the plain directory is not"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-002
    criteria: [REQ-REPO-002, REQ-REPO-005]
    persona: a program holding the link
    starting_state: as EVAL-001
    steps: ["changes and workflow for three repositories by id", "changes with no repository named", "a change in another repository"]
    assertions: ["each repository answers with its own changes and sixteen phases", "the server's own repository", "the change's title and sixteen gates"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-003
    criteria: [REQ-REPO-003, REQ-REPO-007]
    persona: a program holding the link
    starting_state: as EVAL-001
    steps: ["GET /api/processes"]
    assertions: ["each staged session carries its repository's id, branch, and change; no entry has a root key"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-004
    criteria: [REQ-REPO-004]
    persona: maintainer
    starting_state: as EVAL-001, server running
    steps: ["open a codex session in a new repository", "close it"]
    assertions: ["the repository is listed within one answer", "it is still listed after the session ends"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-005
    criteria: [REQ-REPO-001, REQ-REPO-008]
