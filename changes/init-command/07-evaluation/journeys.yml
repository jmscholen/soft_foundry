journeys:
  - id: EVAL-001
    criteria: [AC-001, AC-003, AC-010]
    persona: first-time maintainer (a)
    starting_state: scratch Git repository with a committed app.rb and no Soft Foundry files
    steps:
      - soft-foundry init --no-onboard
      - inspect tree, manifest, repository.yml, harness-evals, .gitignore, AGENTS.md, CLAUDE.md; recompute every manifest hash; cmp every installed .ai file against the packaged set
      - soft-foundry check; soft-foundry doctor
      - git add -A; git commit; record mtimes; sleep 1
      - soft-foundry init --no-onboard (second run); record mtimes; git status
    assertions:
      - "first run exit 0, report begins with root: <target>, check: ok, summary created 171"
      - app.rb SHA-256 identical before and after
      - manifest has 165 entries, 0 hash mismatches, every on-disk .ai file (except manifest and repository.yml) listed, soft_foundry_version 0.2.0
      - every installed .ai file byte-identical to the packaged source; repository.yml equals the template (assessed false, capabilities {}); harness-evals contains only README.md
      - changes/README.md exists; .gitignore contains .soft-foundry/; both pointer files carry the marker; check passes in the target
      - second run exit 0, only skipped lines, summary created 0 updated 0 conflict 0 forced 0, git status clean, all modification times unchanged (stretch)
    evidence: [evidence/EVAL-001-first-install-idempotent.log, evidence/scripts/eval-001.sh]
    result: pass
  - id: EVAL-002
    criteria: [AC-004, AC-005]
    persona: upgrading maintainer (b)
    starting_state: repository with a committed AGENTS.md holding project rules and a CLAUDE.md without trailing newline, no markers
    steps:
      - soft-foundry init --no-onboard
      - cat both files; cmp the original byte length prefix; count markers; git diff --stat; commit
      - soft-foundry init --no-onboard (second run); count markers; git status
    assertions:
      - AGENTS.md and CLAUDE.md reported updated (block appended), exit 0
      - original bytes of each file preserved verbatim as the prefix of the new file
      - exactly one soft-foundry:begin marker in each file
      - second run exit 0, both reported skipped (block present), nothing appended, git status clean
    evidence: [evidence/EVAL-002-pointer-files-preserved.log, evidence/scripts/eval-002.sh]
    result: pass
