notes: "Compatibility mode: performed by a fresh-context agent under evaluation permissions. Status is blocked because one journey (EVAL-014) failed on a specification mismatch; the failure is recorded in blocking and must be resolved by remediation and re-verification, never by editing this handoff. Every journey except EVAL-010 used --no-onboard because the host environment carries real provider keys; EVAL-010 unset them and ran onboarding. Journeys needing a different Soft Foundry package (EVAL-004 next-version, EVAL-012 broken package) used rsync copies of the repository under the scratchpad; the repository itself was not modified. Four transcripts were regenerated once after fixing harness defects (quoting and ordering in the evaluation scripts); expected outcomes were not changed."
