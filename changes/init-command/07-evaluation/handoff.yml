blocking:
  - "EVAL-014 failed: soft-foundry init --root with no value exits 4 with 'internal failure in installer: ArgumentError: --root requires a value', 'This is a defect in Soft Foundry 0.2.0, not in your repository', a backtrace diagnostic, and fork/pull-request guidance; the specification's exit-code contract requires exit 1 for a usage error with a plain explanation (evidence/EVAL-014-cli-surface.log step 5, finding EVAL-F-001). All other journeys (EVAL-001..013, EVAL-015) pass and cover AC-001..AC-016."
findings:
  - id: EVAL-F-001
    severity: major
    summary: init --root with no value exits 4 with "This is a defect in Soft Foundry" and fork/pull-request guidance instead of a usage error with exit 1 (specification Exit codes); the option parser's ArgumentError is wrapped as an internal failure by init's catch-all rescue. EVAL-014 fails on this; nothing is written to the target.
  - id: EVAL-F-002
    severity: minor
    summary: init --help is refused as "unknown option(s) --help" with exit 1; there is no per-command help, only the top-level listing printed by bare soft-foundry.
  - id: EVAL-F-003
    severity: minor
    summary: Conflict runs print no resolving action (no mention of --force, git commit, or git checkout), contrary to the specification's failure-behaviour text for target-side failures; "check ok" directly precedes an exit-3 summary and reads as success.
  - id: EVAL-F-004
    severity: minor
    summary: The summary line does not name conflicted paths and conflict lines are interleaved in path order among up to 170 skipped lines; the MIT-004 git diff hint (VER-006) and the dry-run ordering of updated/forced first are absent.
  - id: EVAL-F-005
    severity: minor
    summary: Onboarding reports "not configured" per provider without naming the environment variable (OPENAI_API_KEY, ANTHROPIC_API_KEY, XAI_API_KEY) the maintainer must set.
  - id: EVAL-F-006
    severity: info
    summary: Conflict reasons ("differs from manifest hash", "not in manifest", "owned by manifest") presume the reader knows what .ai/manifest.yml is; user documentation should define the manifest and the five statuses.
  - id: EVAL-F-007
    severity: info
    summary: The updated upgrade path for an owned .ai/ file now has end-to-end evidence (EVAL-004 shows "updated .ai/rules/ruby.md (owned by manifest)" rewritten with the manifest hash refreshed), closing the evidence half of VER-001; the automated-test half remains open.
  - id: EVAL-F-008
    severity: info
    summary: Every other behaviour in AC-001..AC-016 matched the specification from the user's side across four personas and fifteen journeys - idempotent to the modification time, pointer prose preserved byte for byte, uncommitted edits never overwritten even with --force, no secrets or absolute paths in the internal-failure diagnostic, nothing written on any refusal. AC-017 was proven by verification and not repeated.
