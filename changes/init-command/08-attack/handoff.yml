findings:
- id: ATTACK-F-001
  severity: critical
  summary: 'THREAT-001 / ATTACK-004: Installer#atomic_write writes <path>.soft-foundry-tmp
    with a following File.binwrite and guard_path! never inspects that sibling; a
    committed symlink there is an arbitrary out-of-root file write or creation with
    the maintainer''s rights, reported as success. Remediate by refusing any existing
    entry at the temp path (lstat), using an unpredictable temp name created with
    O_EXCL|O_NOFOLLOW in the destination directory, and re-checking with lstat before
    rename.'
- id: ATTACK-F-002
  severity: major
  summary: 'THREAT-001 / ATTACK-005 (and ATTACK-014c): .soft-foundry/, init.lock and
    runtime.yml are opened with following File.open/File.write and no symlink guard,
    so a committed .soft-foundry symlink or a runtime.yml symlink/hardlink writes
    outside the root through init and onboard; apply guard_path! to .soft-foundry
    and its files and write runtime.yml with the same temp-and-rename primitive; note
    the .soft-foundry/ ignore pattern does not cover a symlink of that name.'
- id: ATTACK-F-003
  severity: major
  summary: 'THREAT-004/006 / ATTACK-021: Git#dirty_paths omits ignored files (git
    status without --ignored), so edits under a git-ignored managed path are treated
    as recoverable and overwritten by --force or by a manifest match; --allow-non-git
    inside a git work tree sets dirty to [] and removes the protection entirely. Treat
    ignored managed files as uncommitted (git status --ignored, or git ls-files --error-unmatch
    per path) and refuse --allow-non-git when the root is inside a git work tree,
    or keep the dirty check active there.'
- id: ATTACK-F-004
  severity: major
  summary: 'THREAT-010 / ATTACK-013: Check#check_path_groups only rejects empty groups;
    overrides that redirect APP/TESTS/INFRA/HARNESS_EVALS to a non-existent tree pass
    init and check, gate verify never reports STALE for lib/app.rb, and .ai/harness-evals/**
    falls outside every deny_read. Emptied groups are caught but surface as an exit-4
    misclassification (ATTACK-F-005). check should validate overrides against paths.yml
    defaults (HARNESS_EVALS must still cover .ai/harness-evals/**; a code group should
    match at least one existing path or be explicitly declared absent).'
- id: ATTACK-F-005
  severity: major
  summary: 'THREAT-012 / ATTACK-015 (with 006, 009, 013): CLI#init rescues every StandardError
    into InternalError, so a regular file, unwritable directory, FIFO or directory
    at .soft-foundry paths or .ai/manifest.yml, invalid YAML in a user .ai/profiles
    file, emptied or malformed repository.yml overrides all exit 4 as ''a defect in
    Soft Foundry'' with fork-and-file guidance; the runtime.yml case fires after a
    complete install and manifest write while the text says nothing further was changed,
    and the specification''s target-side exit 1 for permission denied is not honoured.
    Classify SystemCallError/Psych errors raised on target paths as TargetError, guard
    .soft-foundry and the manifest with lstat before reading, and make ''clean'' exclude
    runs where user-owned-by-rule files or non-packaged .ai files exist.'
- id: ATTACK-F-006
  severity: minor
  summary: 'THREAT-012 / ATTACK-015c-d: CLI#sanitize rewrites the cwd (@root), gem
    root and Dir.home, not the resolved --root, so a diagnostic produced with cwd
    elsewhere contains the target''s absolute path; the ~ rewrite depends on the HOME
    variable. Sanitize against the resolved root as well and consider stripping any
    remaining absolute path prefix.'
- id: ATTACK-F-007
  severity: minor
  summary: 'THREAT-014 / ATTACK-006: a FIFO at .ai/manifest.yml hangs Manifest.load
    (File.binread before any type check) and a FIFO at .gitignore hangs the git status
    subprocess run before guard_path!; requires local filesystem access. Run guard_path!
    (lstat) on the manifest and .gitignore before reading or invoking git, and consider
    a timeout on the git subprocess.'
- id: ATTACK-F-008
  severity: minor
  summary: 'THREAT-015 / ATTACK-019: provider-derived error strings and model ids
    are stored raw and untruncated in runtime.yml (a 5000-character id kept) and soft-foundry
    models prints them unsanitized (ESC bytes and a report-shaped ''conflicts:'' line
    at column 0 observed); apply Provider.sanitize plus the MIT-015 200-character
    truncation before writing runtime.yml and in the models command.'
- id: ATTACK-F-009
  severity: minor
  summary: 'THREAT-008 / ATTACK-011: MIT-008''s refusal of --root / and warning on
    a HOME root are not implemented (--root / --allow-non-git --dry-run plans 171
    creates; a HOME root prints no warning). All other root probes (subdirectory,
    other repo, parent, -x, empty, GIT_DIR, GIT_WORK_TREE, GIT_CEILING_DIRECTORIES,
    symlinked root) were denied or explicit.'
- id: ATTACK-F-010
  severity: minor
  summary: 'THREAT-014 / ATTACK-018 and ATTACK-009: whole files are read into memory
