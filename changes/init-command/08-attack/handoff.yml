ve network calls with real keys, no key value leaked) is disclosed in full in attack-plan.md/results.md and summarized as ATTACK-F-N04; it is a tester-side envelope deviation, corrected immediately, not a product finding. All scratch directories under the session scratchpad were deleted after evidence collection and the final real-key-pattern scan of all evidence files found none."
