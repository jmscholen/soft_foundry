  - id: ATTACK-013
    threat: THREAT-010
    violation_attempted: "neutralize gate staleness and permission checks for later phases through a pre-seeded .ai/repository.yml"
    starting_privilege: "contributor who can commit repository.yml before init; overrides that EMPTY APP/TESTS/INFRA/HARNESS_EVALS, and separately overrides that REDIRECT them to nothing/**, plus CONTROL_PLANE redirected; also a nested-array override value"
