    observed: "FIXED (all five sub-cases, keys unset and verified for every run). .soft-foundry dir symlink to outside: init and onboard both refuse with `.soft-foundry is a symlink; refusing to write/use it`, exit 1, outside dir stays empty. runtime.yml symlink to an outside victim: onboard refuses `.soft-foundry/runtime.yml is a symlink; refusing to write through it`, exit 1, victim content unchanged (`VICTIM ORIGINAL CONTENT`). init.lock dangling symlink: `init does not write through symlinks`, exit 1, lock victim path never created. Internal symlink .soft-foundry -> state/: refused the same way as the outside case; state/ stays empty. runtime.yml as a HARDLINK to an in-root file (sensitive.txt): onboard succeeds (exit 0) because a hardlink is a regular file, not a symlink, so refuse_symlink! does not (and structurally cannot) refuse it by type -- but the write is still safe: SafeWrite writes the new content to a temp sibling and `File.rename(tmp, path)`s over the `runtime.yml` name, which POSIX rename(2) semantics replace atomically without touching the other hardlink's directory entry or the shared inode's other name; verified sensitive.txt's content and inode number are unchanged after the write, and runtime.yml now points to a distinct new inode. Residual observation carried over from the first pass, unchanged: `git check-ignore -v .soft-foundry` on the symlink itself still fails to match (exit 1) because `.soft-foundry/` as a gitignore pattern matches the directory's contents, not a same-named symlink; this only matters if the symlink itself is later `git add`ed, which init/onboard now refuse to write through in the first place, so the practical exposure is closed even though the ignore-pattern quirk itself is unchanged."
