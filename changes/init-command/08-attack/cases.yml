    expected_safe_behavior: "init still installs the full canonical set in every case; check errors naming every emptied or redirected group; CONTROL_PLANE and HARNESS_EVALS overrides are refused outright regardless of file layout"
    observed: "FIXED for the reproduction case and stronger than the original threat model asked for CONTROL_PLANE/HARNESS_EVALS, with one residual gap found. EMPTY overrides: check reports four errors (`path group APP/TESTS/INFRA resolves to no patterns`, plus `repository.yml overrides protected path group HARNESS_EVALS`), exit 2 on standalone check; init's own post-install check surfaces the same four lines and does NOT silently pass. REDIRECT overrides (nothing/**) with CONTROL_PLANE and HARNESS_EVALS included: both protected groups are refused unconditionally (`repository.yml overrides protected path group HARNESS_EVALS/CONTROL_PLANE; the default is kept and the override must be removed`) -- CONTROL_PLANE.HARNESS_EVALS overrides can no longer succeed at all, closing the highest-impact half of the original violation (eval-denial blinding and control-plane redirection) unconditionally, independent of file layout. REDIRECT for APP/TESTS/INFRA with a real lib/app.rb present in the target: correctly flagged (`repository.yml override for APP matches no files while the default patterns do; staleness and permissions would be blind`). Confirmed the protected-group and matches-no-files checks in check.rb ARE invoked by init's own post-install check (cli.rb calls `Check.new(ControlPlane.new(root)).run`, which includes check_path_groups), not only by standalone `soft-foundry check` -- this directly answers the coordinator's question. RESIDUAL GAP (new finding, ATTACK-F-N01): REDIRECT for APP/TESTS/INFRA in a target with NO files under any default APP/TESTS/INFRA glob (a genuinely fresh repository, or any non-Ruby-convention layout) passes both init and check silently (`check: ok`, exit 0) -- the 'override matches no files while default does' rule can never fire when the untouched default ALSO matches nothing, which is exactly a brand-new repository's natural state. Confirmed the resulting path_groups[\"APP\"] resolves to [\"nothing/**\"] with files_matching returning []. This reproduces THREAT-010's blinding effect for APP/TESTS/INFRA specifically (not CONTROL_PLANE/HARNESS_EVALS, which are unconditionally protected) in exactly the repository shape where a maintainer is most likely to run init for the first time. Also probed: a nested-array APP override ([[nested, array]]) still crashes check_path_groups with a raw `NoMethodError: undefined method 'end_with?' for an instance of Array` (unchanged robustness bug) -- but it can no longer be exit-4-misclassified as a Soft Foundry defect, because the only way this value reaches check is via a pre-existing repository.yml, which always makes Installer#plan's `clean` flag false (repository.yml status is `skipped`, not `created`), routing the failure to the target-side `check: failed` branch instead of `InternalError`. Verified this holds even under a simulated HOME/cwd-mismatch scenario (NEW probe embedded in ATTACK-015b)."
    result: denied
    new_findings: [ATTACK-F-N01]
    evidence: [evidence/ATTACK-013-repository-overrides.log, evidence/ATTACK-015b-sanitization-and-real-defect.log]
