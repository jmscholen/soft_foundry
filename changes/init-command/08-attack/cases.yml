authorization_envelope:
  target: "`soft-foundry init` and related commands from this repository at HEAD, exercised only against scratch copies and throwaway git repositories created under a temp directory (`mktemp -d`-style, under the session scratchpad); the packaged source may be a copied, deliberately tampered copy of this repository under that temp directory."
  environment: "local, ephemeral, synthetic data only."
  authorized_by: "the repository maintainer, who instructed the lifecycle to continue; local ephemeral testing with synthetic data needs no further authorization under .ai/policies/human-boundaries.yml."
  allowed_surfaces:
    - "the CLI (init, onboard, check, gate, doctor, ci, models)"
    - "filesystem manipulation inside the scratch directories (symlinks, FIFOs, hardlinks, hand-edited manifests, forged markers, .gitignore/.git/info/exclude manipulation, permission changes)"
    - "environment variables for the CLI process (GIT_DIR, GIT_WORK_TREE, HOME, fake/canary provider keys)"
    - "concurrent invocations"
    - "oversized or malformed inputs"
    - "tampered packaged copies"
    - "a real git worktree and a real git submodule as targets"
  prohibited_surfaces:
    - "this repository's working tree outside changes/init-command/08-attack/"
    - "any path outside the temp directory, including the real home directory"
    - "any other repository"
    - "any network destination (unset OPENAI_API_KEY, ANTHROPIC_API_KEY, XAI_API_KEY, or use --no-onboard, so no provider call is made; if a test needs a \"configured\" provider use a fake/canary key and expect a network error, or stub Provider#discover in-process so no connection is attempted)"
    - "any third-party system"
    - "system configuration"
    - "anything requiring elevated privileges"
  data_constraints: "synthetic only; never place real credentials in scratch files; scan evidence for the string patterns of real keys before finishing."
  network_constraints: "none permitted."
  destructive_actions: "permitted only inside the scratch directories; delete them when done."
