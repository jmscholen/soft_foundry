    threat: THREAT-001
    violation_attempted: "write outside the target root through a top-level .ai symlink"
    starting_privilege: "contributor who can commit a symlink; fresh git repo with .ai -> <outside dir>"
    steps:
      - "mkrepo target; ln -s <outside> target/.ai"
      - "init --no-onboard; init --no-onboard --force"
      - "inspect <outside> and the target"
    expected_safe_behavior: "refused before any write, exit 1, path named, outside directory unchanged"
    observed: "`.ai is a symlink; init does not write through symlinks`, exit 1 both times; outside directory empty; target unchanged"
    result: denied
    evidence: [evidence/ATTACK-001-symlinked-ai.log]
