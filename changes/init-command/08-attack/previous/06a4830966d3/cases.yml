authorization_envelope:
  target: "`soft-foundry init` and related commands from this repository at HEAD, exercised only against scratch copies and throwaway git repositories you create under a temporary directory (`mktemp -d`); the packaged source may be a copied, deliberately tampered copy of this repository under that temp directory."
  environment: "local, ephemeral, synthetic data only."
  authorized_by: "the repository maintainer, who instructed the lifecycle to continue; local ephemeral testing with synthetic data needs no further authorization under .ai/policies/human-boundaries.yml."
  allowed_surfaces:
    - "the CLI (init, onboard, check, gate, doctor, ci, models)"
    - "filesystem manipulation inside the scratch directories (symlinks, FIFOs, hand-edited manifests, forged markers, .gitignore negations, permission changes, disk-quota simulation via injected failures only if achievable without system changes)"
    - "environment variables for the CLI process (GIT_DIR, GIT_WORK_TREE, provider keys set to fake values)"
    - "concurrent invocations"
    - "oversized or malformed inputs"
    - "tampered packaged copies"
  prohibited_surfaces:
    - "this repository's working tree except changes/init-command/08-attack/"
    - "any path under the user's home directory outside the temp directory"
    - "any other repository"
    - "any network destination (unset OPENAI_API_KEY, ANTHROPIC_API_KEY, XAI_API_KEY, or use --no-onboard, so no provider call is made; if a test needs a \"configured\" provider use a fake key and expect a network error or block it)"
    - "any third-party system"
    - "system configuration"
    - "anything requiring elevated privileges"
  data_constraints: "synthetic only; never place real credentials in scratch files; scan your evidence for the string patterns of real keys before finishing."
  network_constraints: "none permitted."
  destructive_actions: "permitted only inside the scratch directories; delete them when done."
