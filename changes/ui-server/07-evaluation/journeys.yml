journeys:
  - id: EVAL-001
    criteria: [REQ-UI-001, REQ-UI-002, REQ-UI-004]
    persona: maintainer
    starting_state: this repository on change/ui-server
    steps: ["soft-foundry ui --port 4879", "GET each of the six routes", "GET /api/changes again within 2 s", "send the process SIGTERM"]
    assertions: ["first line is ui: serving http://127.0.0.1:4879/ (read-only; press Ctrl-C to stop)", "each route 200 with its content type; the board takes 0.67 s, a change 0.06 s", "the repeat takes under a millisecond", "ui: stopped; exit 0"]
