  - id: EVAL-002
    criteria: [REQ-UI-001]
    persona: reader of the terminal output
    starting_state: as EVAL-001, and an empty directory
    steps: ["ui on a port already in use", "ui --port eighty", "ui --host 0.0.0.0", "ui in a directory with no .ai/"]
    assertions: ["each prints one line naming the problem and what to do, and exits 1"]
    evidence: [evidence/journey-transcript.log]
    result: pass
  - id: EVAL-003
    criteria: [REQ-UI-004, REQ-UI-007]
