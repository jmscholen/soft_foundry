journeys:
- id: EVAL-001
  criteria:
  - AC-FR-019
  - AC-FR-020
  persona: Maintainer of a Rails application repository
  starting_state: A Rails-shaped git repository (Gemfile naming rails and rspec-rails,
    config/application.rb, app/models, app/controllers, db/schema.rb, spec/, README,
    CI workflow) on main, with no control plane.
  steps:
  - Run soft-foundry init --no-onboard from this repository's source with LANG unset
  - Run soft-foundry check and read the profile .ai/repository.yml
  - Commit, branch change/refund-cap, run soft-foundry change new refund-cap
  - Run soft-foundry eval and soft-foundry eval --json in that repository
  assertions:
  - init exits 0 and prints check ok; check passes with 16 phases and 17 skills
  - the profile records framework rails and a ruby testing entry; doctor reports mode
    block from the repository policy (and a fail for the hook not yet installed, which
    `hooks install --claude` then clears)
  - change new declares surfaces.accessibility true citing the detected rails framework
  - eval passes 12, fails 0, errors 0, skips 1 (the live case), exit 0, and the JSON
    carries version 1 and the same outcomes (12 pass, 1 skip)
  evidence:
  - evidence/rails-install-profile-change-new-eval.txt
  result: pass
- id: EVAL-002
  criteria:
  - AC-FR-007
  - AC-FR-008
  - AC-FR-019
  persona: Implementing agent under the implementation skill, in the installed Rails
    repository
  starting_state: The same repository on change/refund-cap with status in_progress
    and current_phase implement, block mode installed.
  steps:
  - Pipe guard tool calls on stdin - Edit app/models/user.rb, Edit spec/models/user_spec.rb
    (absolute path), Write db/migrate/..., Bash bundle exec rspec spec/models
  - Pipe Edit of a rules file, Edit of the change's verification results, Read of
    the harness-evals README, a Bash command naming the enforcement policy, and a
    Write to the host settings file
  - Pipe REM-002 attempts - a Bash command that cd's into the policies directory and
    edits the policy by relative name, a Bash command naming the policy by glob, an
    Edit of a symlink that points at the policy, and a Write under the guard's .soft-foundry
    directory
  - Pipe REM-003 attempts - cd into a subdirectory, cd .. back to the root, then cd
    into policies and edit by relative name; a brace-expanded name; a tilde-user token
    that does not resolve; a path containing a NUL byte; Grep and Glob aimed at the
    harness-evals directory; Grep on the application directory
  - Pipe a refused Edit again with SOFT_FOUNDRY_GUARD=warn
  - Read every refusal for an undecidable call (REM-004 changed its wording)
  assertions:
  - the four application and test calls and the Grep on the application directory
    exit 0 with no output
  - the five protected calls, the four REM-002 attempts (cd then relative edit, glob,
    symlink, .soft-foundry write) and the seven REM-003 attempts (chained cd .., brace,
    unresolvable tilde user, NUL byte, Grep and Glob on harness-evals) exit 2; the
    unresolvable tilde and NUL calls are reported as could not be decided and refused
    rather than raising, and now say "the guard refuses what it cannot decide" with
    no empty skill name (EVAL-F4 closed); the symlink is reported as the policy file
    it resolves to; the five protected calls exit 2 with a fail guard line naming
    the tool, the path, the skill, mode block, the policy file, and that a machine-local
    override is documented (it does not name a value)
  - under SOFT_FOUNDRY_GUARD=warn the same call exits 0 with a warn guard line and
    mode warn
  evidence:
  - evidence/rails-guard-decisions.txt
  result: pass
