journeys:
  - id: EVAL-001
    criteria: [AC-FR-019, AC-FR-020]
    persona: Maintainer of a Rails application repository
    starting_state: A Rails-shaped git repository (Gemfile naming rails and rspec-rails, config/application.rb, app/models, app/controllers, db/schema.rb, spec/, README, CI workflow) on main, with no control plane.
    steps:
      - Run soft-foundry init --no-onboard from this repository's source with LANG unset
      - Run soft-foundry check and read the profile .ai/repository.yml
      - Commit, branch change/refund-cap, run soft-foundry change new refund-cap
      - Run soft-foundry eval and soft-foundry eval --json in that repository
    assertions:
      - init exits 0 and prints check ok; check passes with 16 phases and 17 skills
      - the profile records framework rails and a ruby testing entry; doctor reports mode block from the repository policy
      - change new declares surfaces.accessibility true citing the detected rails framework
      - eval passes 12, fails 0, errors 0, skips 1 (the live case), exit 0, and the JSON carries version 1 and the same outcomes (12 pass, 1 skip)
    evidence: [evidence/rails-install-profile-change-new.txt, evidence/eval-clean-and-live-refusals.txt]
    result: pass
  - id: EVAL-002
    criteria: [AC-FR-007, AC-FR-008, AC-FR-019]
    persona: Implementing agent under the implementation skill, in the installed Rails repository
    starting_state: The same repository on change/refund-cap with status in_progress and current_phase implement, block mode installed.
    steps:
      - Pipe guard tool calls on stdin - Edit app/models/user.rb, Edit spec/models/user_spec.rb (absolute path), Write db/migrate/..., Bash bundle exec rspec spec/models
      - Pipe Edit of a rules file, Edit of the change's verification results, Read of the harness-evals README, a Bash command naming the enforcement policy, and a Write to the host settings file
      - Pipe REM-002 attempts - a Bash command that cd's into the policies directory and edits the policy by relative name, a Bash command naming the policy by glob, an Edit of a symlink that points at the policy, and a Write under the guard's .soft-foundry directory
      - Pipe REM-003 attempts - cd into a subdirectory, cd .. back to the root, then cd into policies and edit by relative name; a brace-expanded name; a tilde-user token that does not resolve; a path containing a NUL byte; Grep and Glob aimed at the harness-evals directory; Grep on the application directory
      - Pipe a refused Edit again with SOFT_FOUNDRY_GUARD=warn
    assertions:
      - the four application and test calls and the Grep on the application directory exit 0 with no output
      - the five protected calls, the four REM-002 attempts (cd then relative edit, glob, symlink, .soft-foundry write) and the seven REM-003 attempts (chained cd .., brace, unresolvable tilde user, NUL byte, Grep and Glob on harness-evals) exit 2; the unresolvable tilde and NUL calls are reported as could not be decided and refused rather than raising; the symlink is reported as the policy file it resolves to; the five protected calls exit 2 with a fail guard line naming the tool, the path, the skill, mode block, the policy file, and that a machine-local override is documented (it does not name a value)
      - under SOFT_FOUNDRY_GUARD=warn the same call exits 0 with a warn guard line and mode warn
    evidence: [evidence/rails-guard-decisions.txt]
    result: pass
  - id: EVAL-003
    criteria: [AC-FR-009, AC-FR-010, AC-FR-011, AC-FR-014, AC-FR-020]
    persona: Maintainer writing and running harness evals
    starting_state: A scratch repository carrying a copy of this repository's control plane.
    steps:
      - Run eval (see EVAL-001 evidence for the clean run)
      - Add a case whose expected outcome is reversed and run eval --case on it
      - Add a case file that is not valid YAML, one naming an unknown check, and one whose embedded file content is 70000 bytes (over the 65536 cap); run check and eval
      - Run the live case without --live, with --live and no --shell, and with --shell naming a shell that is not supported
    assertions:
      - the reversed case is reported fail with expected and observed outcomes, exit 2
      - check reports one error per bad file naming the file (the oversize case names the path, 70001 bytes and the 65536 limit); eval reports each as error, continues, and runs the remaining cases (13 passed, 1 failed, 2 errors, 1 skipped)
      - the live case is skip with the command to run it (exit 0); with --live and no --shell it is error naming --shell (exit 2); an unsupported shell is refused with exit 1 and the supported list
      - every line starts with a status glyph followed by the outcome word at a fixed position
    evidence: [evidence/eval-failure-modes.txt, evidence/eval-clean-and-live-refusals.txt]
    result: pass
  - id: EVAL-004
    criteria: [AC-FR-015]
    persona: Maintainer running the live harness eval on the installed claude shell
    starting_state: This repository at HEAD, claude CLI installed, live case review-finds-planted-defect.
    steps:
      - Run eval --live --shell claude --case review-finds-planted-defect with no shell arguments
      - Run it again passing the shell arguments --allowedTools and --permission-mode acceptEdits after --
    assertions:
      - run 1 - the fresh review session found the planted defect (cap not applied, negative not zeroed, empty test file) but could not write 13-review (permission prompts were not granted in the non-interactive session), so the case failed with 0 findings recorded; reported fail, exit 2
      - run 2 - the review wrote its findings and the case passed, naming the shell claude, the model anthropic/claude-sonnet-5-5, and findings REV-001, REV-002 and REV-003, exit 0
    evidence: [evidence/live-eval-run1-no-write-permission.txt, evidence/live-eval-run2-acceptEdits.txt]
    result: pass
  - id: EVAL-005
    criteria: [AC-FR-016, AC-FR-017, AC-FR-018]
    persona: Maintainer declaring risk and waivers
    starting_state: The scratch Rails repository with a change opened at medium risk and a complete intake handoff.
    steps:
      - Name threat_model in skipped_phases at medium risk and run gate intake; then name judge; then set risk low and name threat_model
      - Run change close without --force and then with --force
    assertions:
      - medium plus threat_model fails waivers permitted naming the phase, the risk, the waivable list and the file; judge fails with the never-waived rule; low plus threat_model passes
      - close without --force exits 1 naming 14-judgment, the judge command and --force; with --force it closes
      - low plus threat_model reports waivers permitted pass; the waivable_by_risk rule refusing review and judgment in check was not re-exercised at this commit (covered by the verification suite)
    evidence: [evidence/waivers-and-close.txt]
    result: pass
