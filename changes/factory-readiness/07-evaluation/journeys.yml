- id: EVAL-004
  criteria:
  - AC-FR-015
  persona: Maintainer running the live harness eval on the installed claude shell
  starting_state: A scratch Rails repository carrying this source tree's control plane
    (HEAD ac3e8cf), claude CLI installed, live case review-finds-planted-defect.
  steps:
  - Run eval --live --shell claude --case review-finds-planted-defect with no shell
    arguments
  - Run it again passing the shell arguments --allowedTools and --permission-mode
    acceptEdits after --
  assertions:
  - run 1 (default invocation, no shell arguments) - the fresh review session found
    the planted defect (REV-001 cap not applied, REV-002 negative not floored, REV-003
    empty test file) but every write into 13-review was refused (non-interactive session),
    so 0 findings were recorded; reported fail, exit 2
  - run 2 (with -- --allowedTools ... --permission-mode acceptEdits) - the review
    wrote its findings; the case passed naming claude, anthropic/claude-sonnet-5-5
    and findings REV-001, REV-002, REV-003, REV-005, exit 0
  evidence:
  - evidence/live-eval-run1-no-write-permission.txt
  - evidence/live-eval-run2-acceptEdits.txt
  result: pass
- id: EVAL-005
  criteria:
  - AC-FR-016
  - AC-FR-017
  - AC-FR-018
  persona: Maintainer declaring risk and waivers
  starting_state: The scratch Rails repository with a change opened at medium risk
    and a complete intake handoff.
  steps:
  - Name threat_model in skipped_phases at medium risk and run gate intake; then name
    judge; then set risk low and name threat_model
  - Run change close without --force and then with --force
  assertions:
  - medium plus threat_model fails waivers permitted naming the phase, the risk, the
    waivable list and the file; judge fails with the never-waived rule; low plus threat_model
    passes
  - close without --force exits 1 naming 14-judgment, the judge command and --force;
    with --force it closes
  - low plus threat_model reports waivers permitted pass; the waivable_by_risk rule
    refusing review and judgment in check was not re-exercised at this commit (covered
    by the verification suite)
  evidence:
  - evidence/waivers-and-close.txt
  result: pass
