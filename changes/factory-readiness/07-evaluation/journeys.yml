  - id: EVAL-010
    criteria: [AC-FR-007, AC-FR-008]
    persona: Maintainer who installed the guard on Claude Code, with an implementing agent that changes the guard's configuration by a spelling the preventive check misses (REM-004)
    starting_state: The scratch Rails repository on change/refund-cap, in_progress at implement, block mode in the repository policy.
    steps:
      - Run hooks install --claude and doctor
      - Pipe a benign Bash call to guard (records the pre-call baseline)
      - Change .ai/policies/enforcement.yml to mode off directly (standing in for any spelling the preventive check misses), then run guard --after
      - Repeat with a machine-local override .soft-foundry/enforcement.yml created during the call
      - Run guard --after after a call that changed nothing; make an edit between calls and run guard then guard --after; run hooks uninstall --claude
    assertions:
      - hooks install writes a PreToolUse entry whose matcher includes Grep and Glob and a PostToolUse entry with matcher Bash; doctor then passes the guard line
      - guard --after after the policy was set to off restores mode block, exits 2, says the file changed during the tool call and was restored, logs a tamper line, and git shows the policy unchanged
      - the override created during the call is removed and reported the same way, exit 2
      - a call that changed nothing exits 0 with no output; a change made between calls stands as the next baseline (exit 0, content kept)
      - hooks uninstall removes both entries
    evidence: [evidence/guard-post-call-restore.txt]
    result: pass
