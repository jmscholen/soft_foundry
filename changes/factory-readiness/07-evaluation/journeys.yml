- id: EVAL-010
  criteria:
  - AC-FR-007
  - AC-FR-008
  persona: Maintainer who installed the guard on Claude Code and who also edits the
    guard configuration in their own shell between agent tool calls (REM-004, REM-005)
  starting_state: The scratch Rails repository on change/refund-cap, in_progress at
    implement, block mode in the repository policy.
  steps:
  - Run hooks install --claude and doctor
  - Pipe a Bash call to guard (baseline), set the policy to mode off, run guard --after;
    repeat with a machine-local override created during the call
  - 'Overlap (REM-005): call A pre, A tampers, call B pre, B after, A after'
  - Replace .claude/settings.json by a symlink during a call (REM-005)
  - 'Scenario A: an Edit-tool call goes through guard (PreToolUse only; PostToolUse
    matches Bash), the maintainer then edits enforcement.yml to mode warn in their
    own shell, then a Bash call (guard, then guard --after)'
  - 'Scenario B: as A, but the maintainer runs hooks uninstall --claude between the
    two calls'
  - 'Scenario C: Bash-only sequence, an edit between two Bash calls'
  assertions:
  - 'PASS: hooks install writes PreToolUse (with Grep and Glob) and PostToolUse Bash;
    doctor passes the guard line'
  - 'PASS: a policy set to off, or an override created, during a Bash call is restored
    or removed and refused, exit 2, tamper logged'
  - 'PASS (REM-005): in an overlap the first check restores and the second is quiet
    (exit 0); a settings file replaced by a symlink becomes the regular file with
    its original content and the link target is untouched; a check with nothing to
    restore is quiet'
  - 'PASS: Bash-only sequence - an edit made between calls stands (mode warn kept,
    exit 0)'
  - 'PASS (REM-006, EVAL-F7 closed): Scenario A - after an Edit-tool call (which now records
    no baseline) the maintainer''s edit of enforcement.yml (block to warn) stands; the next
    Bash call and its guard --after exit 0 and the file keeps mode warn. Scenario B - after
    Read, Grep and Glob calls, hooks uninstall --claude stands (doctor reports the hook not
    installed); an interrupted Bash call''s baseline is cleared by hooks install and uninstall'
  - 'PASS: Scenario C (corrected) - after a completed Bash call, an edit made before the next
    pre-call stands (mode warn, exit 0); a tamper made while a Bash call was in flight with a
    Read call overlapping is still restored and refused, exit 2'
  evidence:
  - evidence/guard-post-call-restore.txt
  result: pass
