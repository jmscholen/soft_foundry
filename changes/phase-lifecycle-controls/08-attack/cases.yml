  starting_privilege: Stub sessions that run git commit
  steps:
  - Run evaluate and attack in parallel with sessions that both commit
  expected_safe_behavior: Warn and non-zero exit; evidence still names the start HEAD
  observed: 'Exit 1 with a `warn: HEAD moved from 8a52c8e to b06973b` line; one of
