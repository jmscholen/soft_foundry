  observed: 'history entries stayed 0 in all five kills. Kill 1 left the record byte-identical
    apart from 7 temp files. Kills 2, 3 and 6 left the first N handoffs pending
    and the rest complete: ci exit 2, close refused (a required phase is pending),
    status shows FAIL on the stale phases. Kill 7 (before the metadata rename) left
    all six pending with no history; close refused. Every retry was refused: kills
    1 to 6 by the leftover `.soft-foundry-tmp` file (named, remove and rerun), kill
    7 by "nothing to reset". `check` stays exit 0 and `gate judge` still passes
    on the half-reset record; only ci, status and close notice'
  result: denied
  evidence:
