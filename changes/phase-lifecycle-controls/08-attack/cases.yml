  - evidence/drive5.txt
- id: ATTACK-014
  threat: THREAT-005
  violation_attempted: Trivial commit throws away a good verdict, or a closed or released
    record is reset by `phase run` (AC-A6, PAC-11)
  starting_privilege: Person or session making a code commit
  steps:
  - 'With evaluate and attack complete: run when current, commit an app change, run
