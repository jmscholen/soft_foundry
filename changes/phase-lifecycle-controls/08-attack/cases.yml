  starting_privilege: Person running the CLI
  steps:
  - 'Nine refusal inputs: implement+review, evaluate twice, Evaluate Attack, judge+attack,
    one phase, three phases, verify+attack, ../attack, attack with trailing newline'
  - Compare the tree before and after
  expected_safe_behavior: Nothing starts and nothing is written
  observed: All refused (exit 1) with a reason; tree byte-identical
