version: 1
require_human_approval:
  - production destructive operations
  - irreversible data deletion
  - credential or secret disclosure
  - legal commitments
  - publishing or changing the application's privacy policy, security policy, or terms (a legal commitment; recorded under human_decisions in the change's metadata.yml)
  - financial commitments or transfers
  - security testing against production or third-party systems without explicit authorization
  - changes that intentionally weaken required controls
  - exceeding a change's declared budget cap in .ai/policies/budget.yml (a financial commitment)
  - deploying to any environment other than the development environment recorded under environments in .ai/repository.yml (staging and production deploys are a person's call, on either lifecycle track)
never_autonomous:
  - bypassing access controls
  - fabricating evidence
  - modifying another skill's evidence to obtain a pass
  - weakening acceptance criteria solely because implementation failed
