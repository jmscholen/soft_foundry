name: exploration
model: coding_high
stage: exploring               # not a lifecycle phase: loaded while a change's status is exploring (.ai/workflow.yml tracks.iterative)
rules:
  baseline:
    - .ai/rules/general.md
    - .ai/rules/architecture.md
    - .ai/rules/security.md
    - .ai/rules/errors.md
    - .ai/rules/dependencies.md
    - .ai/rules/observability.md
    - .ai/rules/git.md
  discovered:
    language: true
    framework: true
    database: true
    testing: true
    infrastructure_as_code: true
  infrastructure_rule: .ai/rules/infrastructure.md
outputs: [code_changes, draft_specification, iteration_journal]
completion: completion.yml
