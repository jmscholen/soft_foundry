version: 1
name: soft-foundry-maturity

status_values:
  - PASS
  - PARTIAL
  - MISSING
  - UNKNOWN
  - EXTERNAL
  - NOT_APPLICABLE

scoring:
  rule: highest_contiguous_level_with_all_required_capabilities_satisfied
  satisfied_statuses:
    - PASS
    - EXTERNAL
    - NOT_APPLICABLE
  unsatisfied_statuses:
    - PARTIAL
    - MISSING
    - UNKNOWN

levels:
  0:
    id: unknown
    name: Unknown
    description: Repository has not been assessed or evidence is insufficient to determine readiness.
    requires: []

  1:
    id: agent_accessible
    name: Agent Accessible
    description: An engineering agent can enter, understand how to begin, and execute repository-local work safely.
    requires:
      - repository.git_detected
      - repository.agent_bootstrap
      - repository.execution_path_known

  2:
    id: contextualized
    name: Contextualized
    description: Repository architecture, technology, standards, infrastructure, and operational context are discoverable.
    requires:
      - architecture.documented_or_discoverable
      - coding_standards.defined
      - technology.languages_detected
      - technology.frameworks_detected
      - infrastructure.detected_or_not_applicable
      - testing.strategy_detected

  3:
    id: spec_driven
    name: Spec Driven
    description: Changes are driven by explicit intent, requirements, acceptance criteria, and durable provenance.
    requires:
      - change.intake_required
      - change.specification_required
      - change.acceptance_criteria_required
      - change.provenance_enabled
      - change.acceptance_criteria_locking

  4:
    id: verified
    name: Verified
    description: Changes are independently verified against automated and user-facing acceptance evidence.
    requires:
      - verification.automated_tests
      - verification.gate
      - evaluation.user_journey_gate
      - evidence.commit_binding
      - evidence.failed_results_retained

  5:
    id: governed
    name: Governed
    description: Engineering work is constrained by risk, security, separation of duties, observability, and explicit judgment gates.
    requires:
      - governance.risk_classification
      - governance.skill_permissions
      - governance.human_boundaries
      - governance.separation_of_duties
      - security.threat_modeling
      - security.adversarial_validation
      - observability.failure_detection
      - observability.health_signal
      - observability.operational_visibility
      - observability.alerting
      - observability.standard_dashboard
      - accessibility.standard_in_force
      - policy_conformance.standard_in_force
      - judgment.final_gate

  6:
    id: evaluated
    name: Evaluated
    description: The engineering harness, workflows, prompts, routing, and model choices are themselves measured against repeatable benchmarks.
    requires:
      - harness.benchmark_suite
      - harness.model_evaluation
      - harness.workflow_evaluation
      - harness.regression_detection

  7:
    id: self_improving
    name: Self Improving
    description: Findings and failures are converted into durable improvements to standards, tests, workflows, and harness behavior.
    requires:
      - learning.finding_capture
      - learning.feedback_loop
      - learning.regression_creation
      - learning.standards_feedback
      - learning.workflow_feedback

capability_guidance:
  observability:
    production_service:
      required:
        - observability.failure_detection
        - observability.health_signal
        - observability.operational_visibility
        - observability.alerting
      conditional:
        request_serving:
          - observability.error_rate_signal
          - observability.latency_signal
        asynchronous_processing:
          - observability.job_failure_signal
          - observability.backlog_signal
        database:
          - observability.database_health_signal
        external_integrations:
          - observability.integration_failure_signal
    infrastructure_as_code:
      # When infrastructure.detected_or_not_applicable finds Terraform, OpenTofu,
      # Pulumi, CloudFormation, or an equivalent declarative system, every
      # conditional capability whose resource type is actually provisioned
      # becomes required, not merely contextual, and rolls up into
      # observability.standard_dashboard (see .ai/rules/observability.md for
      # the golden-signal/RED/USE baseline each provisioned resource type owes).
      required_when_provisioned:
        compute_or_request_serving:
          - observability.error_rate_signal
          - observability.latency_signal
        queue_or_async_worker:
          - observability.job_failure_signal
          - observability.backlog_signal
        database:
          - observability.database_health_signal
        external_integration:
          - observability.integration_failure_signal

assessment_rules:
  - Lifecycle-shaped capabilities (change.*, verification.*, evaluation.*, evidence.*, judgment.*) are satisfied by either lifecycle track in .ai/workflow.yml tracks. The iterative track's exploring stage precedes the lifecycle's hardening phases rather than replacing them; a change is only "through the lifecycle" once vetted and hardened. change.acceptance_criteria_locking is deterministic on the iterative track (the gate's specification-locked check from the vetted commit) and policy-only on the gated track.
  - governance.skill_permissions is PASS when every skill declares read/write/deny sets that check lints and a runtime guard can enforce them in the coding shell (a PreToolUse hook that reads the active skill from the change record); whether a given machine has the hook installed is an operational fact doctor reports, not a repository capability. Declared and linted but unenforceable stays PARTIAL.
  - governance.separation_of_duties is PASS when implementation cannot write evidence (permissions the guard enforces) and review and judgment can be executed in a fresh session with only their own skill loaded, with the record saying whether they were (executed_by in the handoff; an advisory when they were not). A repository that only declares the separation stays PARTIAL.
  - evidence.failed_results_retained is PASS when failed results of every kind are kept in the record and something checks they were not deleted; retaining only the failing-test commit (red_commit, which the gate verifies) is PARTIAL.
  - learning.finding_capture is PASS when at least one change's learning phase has completed with instincts (15-learning/instincts.yml) the gate validated; a template with no completed learning phase is PARTIAL.
  - learning.feedback_loop is PASS when a proposed rule reaches the rules only through a governance path the tool enforces (`soft-foundry learn promote` writes .ai/rules/learned.md and refuses outside a change record on a change branch); a learning phase whose proposals have no path into the rules is MISSING.
  - learning.standards_feedback is PASS when promoted instincts are loaded by implementation as rules (.ai/rules/learned.md in the baseline list) with their provenance; PARTIAL when they are recorded but not loaded.
  - policy_conformance.standard_in_force is PASS when .ai/rules/policy-conformance.md exists and the review skill requires a policy-conformance review that cites it against the documents recorded under policies: in .ai/repository.yml. Findings against the standard are go-live advisories printed by gate/status/ci/close, never lifecycle gate failures; a published document recorded MISSING is a visible gap of the application, not of this capability.
  - accessibility.standard_in_force is PASS when .ai/rules/accessibility.md (or a stricter repository-named standard) exists and the review skill requires an accessibility review that cites it. Findings against the standard are go-live advisories printed by gate/status/ci/close, never lifecycle gate failures; the capability is about the standard being in force, not about every change conforming.
  - Missing repository evidence must be UNKNOWN unless absence itself is conclusively established.
  - A capability implemented outside the repository may be EXTERNAL only when evidence identifies the external system or ownership boundary.
  - NOT_APPLICABLE requires an explicit applicability rationale.
  - A dashboard is not intrinsically required for observability.operational_visibility if another operational surface satisfies it with equivalent evidence; this exemption does not extend to observability.standard_dashboard, which specifically requires a provisioned, APM-equivalent monitoring dashboard.
  - New production failure modes introduced by a change require a corresponding detection mechanism before the change is complete.
  - Infrastructure-as-code discovery must inspect Terraform, OpenTofu, Pulumi, and repository-specific deployment definitions when present.
  - observability.standard_dashboard is NOT_APPLICABLE only when infrastructure.detected_or_not_applicable establishes no infrastructure-as-code is present in or owned by the repository. Whenever IaC is present, it must reach PASS (a dashboard-as-code resource provisioned in this repository's IaC, covering the golden-signal/RED/USE baseline for each provisioned resource type per capability_guidance.observability.infrastructure_as_code) or EXTERNAL (the dashboard is provisioned and owned by an identified external system/team) — never NOT_APPLICABLE or a default MISSING.
