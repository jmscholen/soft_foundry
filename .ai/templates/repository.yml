version: 1

# This file is the committed repository capability profile (unassessed template). It is populated and
# refreshed by onboarding/discovery. Evidence should be repository-relative and
# must not contain credentials or machine-local provider state.

repository:
  assessed: false
  assessed_at: null
  commit_sha: null

technology:
  languages: []
  frameworks: []
  databases: []
  testing: []

infrastructure:
  detected: []
  iac:
    tools: []
  deployment_targets: []

# Environments the application can be deployed to, located by discovery.
# The exploring stage of the iterative track (.ai/workflow.yml tracks:)
# deploys only to `development`; deploying anywhere else is a person's
# decision under .ai/policies/human-boundaries.yml. `data` is synthetic
# or real; `how` is the command or process that deploys there.
environments:
  development:
    status: UNKNOWN          # PASS (exists, `how` recorded), MISSING, UNKNOWN, or NOT_APPLICABLE with a rationale
    data: synthetic
    how: null

# Published policy documents the application's users can see, located by
# discovery per .ai/rules/policy-conformance.md. Status is PASS (found),
# MISSING (absence established), UNKNOWN (not determined), or
# NOT_APPLICABLE (with a rationale). Evidence is a repository path or URL.
policies:
  privacy:
    status: UNKNOWN
  security:
    status: UNKNOWN
  terms:
    status: UNKNOWN

capabilities: {}

# Capability entry example:
# capabilities:
#   observability.operational_visibility:
#     status: PARTIAL
#     evidence:
#       - infra/monitoring.ts
#     findings:
#       - application_dashboard_not_detected
#     rationale: CloudWatch alarms exist, but no operator health surface was found.
#
# Allowed status values are defined by .ai/maturity.yml:
# PASS, PARTIAL, MISSING, UNKNOWN, EXTERNAL, NOT_APPLICABLE

maturity:
  current_level: 0
  current_id: unknown
  gaps: []
