change:
  id: ${CHANGE}
  title: ${TITLE}
git:
  worktree: ${WORKTREE}
  branch: ${BRANCH}
type: TBD                  # feature | fix | refactor | docs | infrastructure | security | chore
risk: TBD                  # low | medium | high
status: intake             # intake | in_progress | awaiting_human | judged | closed
current_phase: intake
created_at: ${CREATED_AT}
surfaces:
  application: false
  database: false
  infrastructure: false
  security: false
  accessibility: false
  observability: false

# Phases the harness would otherwise require, deliberately not run for
# this change, each with a non-empty rationale. An entry with an empty
# rationale does not count as a skip - the phase stays required.
skipped_phases: []
