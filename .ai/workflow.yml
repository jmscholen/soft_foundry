version: 1
name: soft-foundry

lifecycle:
  - id: intake
    skill: intake
    output: 00-intake
  - id: discover
    skill: repository-discovery
    output: 01-discovery
  - id: specify
    skill: specification
    output: 02-specification
  - id: threat_model
    skill: threat-modeling
    output: 03-threat-model
  - id: plan
    skill: planning
    output: 04-plan
  - id: implement
    skill: implementation
    output: 05-implementation
  - id: verify
    skill: verification
    output: 06-verification
  - id: evaluate
    skill: evaluation
    output: 07-evaluation
  - id: attack
    skill: adversarial-testing
    output: 08-attack
  - id: remediate
    skill: remediation
    output: 09-remediation
    optional: true        # only runs when a gated phase produced findings
    after: implement      # loop phase: its predecessor is implementation, not attack
  - id: document
    skill: product-documentation
    output: 10-user-documentation
    optional: true        # applicability depends on the change: user-facing behavior, a searchable FAQ, or a deployed service with new failure modes
  - id: index
    skill: faq-indexing
    output: 11-faq-index
    optional: true        # applicability depends on the change: user-facing behavior, a searchable FAQ, or a deployed service with new failure modes
  - id: observe
    skill: observability
    output: 12-observability
    optional: true        # applicability depends on the change: user-facing behavior, a searchable FAQ, or a deployed service with new failure modes
  - id: review
    skill: review
    output: 13-review
  - id: judge
    skill: final-judgment
    output: 14-judgment
  - id: learn
    skill: learning
    output: 15-learning

# Non-linear edges. Every other phase proceeds to the next lifecycle entry.
# A phase's completion gate requires its predecessor complete; `after`
# overrides the predecessor and pending `optional` phases are skipped over.
# Any transition back to `verify` marks verify, evaluate, attack, review, and
# judge evidence stale for the change.
transitions:
  remediate:
    next: verify
  observe:
    next: review
    on_code_change: verify
  review:
    next: judge
    on_blocking_findings: remediate
  judge:
    next: learn
    on_blocked: remediate
    on_rejected: intake

rules:
  templates_required: true
  phase_handoff_required: true
  evidence_commit_binding: true
  stale_evidence_on_code_change: true
  implementation_may_not_grade_itself: true
  final_judgment_required: true
  human_boundary_policy: .ai/policies/human-boundaries.yml
  path_groups: .ai/paths.yml
  handoff_template: .ai/templates/handoff.yml

judgments:
  - APPROVED
  - APPROVED_WITH_RESIDUAL_RISK
  - BLOCKED
  - REJECTED

# Lifecycle tracks. Both share the lifecycle above and the same gate. A
# track decides which phases a change must complete before implementation,
# when the specification locks, and whether an exploring stage exists.
#
#   gated      The stage-gate lifecycle as written above: every phase in
#              order, the specification locked when its phase completes,
#              evidence bound from the first commit.
#   iterative  An exploring stage first: the change is iterated with a
#              person and deployed only to the development environment,
#              with each round appended to changes/<slug>/exploration/
#              iterations.yml and the specification kept as a living
#              draft. `soft-foundry change vet` is the person's recorded
#              acceptance; it locks the specification at that commit and
#              the hardening phases (implement onward) then apply exactly
#              as on the gated track. `change reopen` returns to exploring
#              and resets every phase from implement onward to pending.
#
# While a change is exploring, no phase from implement onward may be
# complete: the exploring stage produces a journal, never evidence.
tracks:
  default: gated
  gated:
    description: Stage-gate lifecycle in order; specification locks when its phase completes.
  iterative:
    description: Exploring stage with a person in a development environment, then vet, then the same hardening phases.
    exploring: true
    skill: exploration          # loaded instead of a phase skill while status is exploring
    output: exploration         # changes/<slug>/exploration/, scaffolded from the skill's templates
    vet_requires: [intake, specify]   # must be complete, with passing gates, before `change vet`
    optional: [discover, threat_model, plan]   # not required before implementation on this track; a change may still run them
  # A change's declared risk can force a track regardless of what
  # `change new --track` asked for; the gate reports the conflict.
  forced_by_risk:
    high: gated
