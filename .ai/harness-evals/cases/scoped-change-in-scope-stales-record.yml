id: scoped-change-in-scope-stales-record
kind: gate
description: A record that declares a scope is stale when a changed code file lies inside that scope. The scoped rule must not hide a change the record owns.
record:
  risk: low
  scope: ["${APP_FILE}"]
  complete: [intake, discover, specify, threat_model, plan, implement, verify]
repository:
  files:
    "${APP_FILE}": "puts 2\n"
expect:
  phase: verify
  check: evidence current
  outcome: fail
