id: evidence-stale-after-code-change
kind: gate
description: Application code edited after verification was recorded makes the verification evidence stale.
record:
  risk: low
  complete: [intake, discover, specify, threat_model, plan, implement, verify]
repository:
  files:
    "${APP_FILE}": "puts 2\n"
expect:
  phase: verify
  check: evidence current
  outcome: fail
