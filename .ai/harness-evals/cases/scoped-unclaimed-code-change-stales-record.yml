id: scoped-unclaimed-code-change-stales-record
kind: gate
description: A code change that no active record's scope claims stales a scoped record. A path nobody owns is never treated as safe to ignore.
record:
  risk: low
  scope: ["docs-only/**"]
  complete: [intake, discover, specify, threat_model, plan, implement, verify]
repository:
  files:
    "${APP_FILE}": "puts 2\n"
expect:
  phase: verify
  check: evidence current
  outcome: fail
