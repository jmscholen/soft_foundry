name: ci

on:
  push:
    branches: [main, go]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      - run: go build -o bin/soft-foundry ./cmd/soft-foundry
      - run: ./bin/soft-foundry version
      - run: ./bin/soft-foundry check
      - run: ./bin/soft-foundry doctor || true

  ruby:
    runs-on: ubuntu-latest
    if: hashFiles('Gemfile') != '' && hashFiles('lib/soft_foundry.rb') != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rake ci
